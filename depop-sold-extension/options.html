<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Sold Tracker — Settings</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #000;
        --text: #fff;
        --text-2: rgba(255, 255, 255, 0.62);
        --text-3: rgba(255, 255, 255, 0.38);
        --line: rgba(255, 255, 255, 0.08);
        --line-strong: rgba(255, 255, 255, 0.16);
        --glass: rgba(255, 255, 255, 0.045);
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; }
      body {
        width: 440px;
        min-height: 360px;
        background: #000;
        color: var(--text);
        font-family: "Inter", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .ambient {
        position: fixed; inset: 0; z-index: -1; pointer-events: none;
        background:
          radial-gradient(60% 40% at 50% 0%, rgba(255,255,255,0.08), transparent 70%),
          #000;
      }
      main { padding: 22px 20px 24px; }
      h1 {
        font-size: 11px; font-weight: 600; letter-spacing: 0.3em;
        text-transform: uppercase; color: var(--text-2);
        margin: 0 0 20px;
      }
      h1 .dot {
        display: inline-block; width: 4px; height: 4px;
        border-radius: 50%; background: var(--text);
        margin: 0 8px 1px; vertical-align: middle;
      }
      .panel {
        background: var(--glass);
        border: 1px solid var(--line);
        border-radius: 18px;
        backdrop-filter: blur(20px) saturate(140%);
        padding: 18px 18px 16px;
        margin-bottom: 14px;
        position: relative; overflow: hidden;
      }
      .panel::before {
        content: ""; position: absolute; inset: 0 0 auto 0;
        height: 1px;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.22), transparent);
      }
      label {
        display: block; font-size: 10px; font-weight: 600;
        letter-spacing: 0.18em; text-transform: uppercase;
        color: var(--text-3); margin-bottom: 10px;
      }
      label small {
        text-transform: none; letter-spacing: 0; font-weight: 400;
        color: var(--text-3); display: block;
        margin-top: 4px; font-size: 11px; line-height: 1.5;
      }
      input[type="text"], input[type="url"], input[type="number"] {
        width: 100%;
        background: rgba(255,255,255,0.04);
        border: 1px solid var(--line-strong);
        border-radius: 10px;
        color: var(--text);
        font-family: ui-monospace, "SF Mono", Menlo, monospace;
        font-size: 13px;
        padding: 12px 14px;
        outline: none;
        transition: border-color 0.15s, background 0.15s;
        margin-bottom: 10px;
      }
      input[type="number"] { font-family: "Inter", system-ui; font-size: 14px; margin-bottom: 0; }
      input:focus {
        border-color: rgba(255,255,255,0.4);
        background: rgba(255,255,255,0.06);
      }
      .code-input {
        font-size: 22px !important;
        letter-spacing: 0.4em;
        text-align: center;
        font-family: ui-monospace, "SF Mono", Menlo, monospace !important;
      }
      .actions {
        display: flex; justify-content: space-between;
        align-items: center; gap: 10px; margin-top: 4px;
      }
      .msg {
        font-size: 11px; letter-spacing: 0.12em;
        text-transform: uppercase; color: var(--text-3);
        min-height: 14px;
      }
      .msg.error { color: #ff8080; letter-spacing: 0; text-transform: none; font-size: 12px; }
      .msg.ok { color: #90ee90; }
      button.primary, button.danger, button.ghost {
        border: none; border-radius: 999px;
        padding: 9px 18px;
        font-family: inherit; font-size: 11px;
        font-weight: 600; letter-spacing: 0.12em;
        text-transform: uppercase; cursor: pointer;
      }
      button.primary { background: #fff; color: #000; }
      button.primary:hover { background: rgba(255,255,255,0.85); }
      button.primary:disabled { background: rgba(255,255,255,0.3); color: rgba(0,0,0,0.5); cursor: wait; }
      button.danger {
        background: transparent; color: var(--text-2);
        border: 1px solid var(--line-strong);
      }
      button.danger:hover { color: #fff; border-color: rgba(255,255,255,0.4); }
      button.ghost {
        background: transparent; color: var(--text-2);
        border: 1px solid var(--line-strong);
        padding: 7px 14px; font-size: 10px;
      }
      button.ghost:hover { color: #fff; border-color: rgba(255,255,255,0.4); }

      .paired-row {
        display: flex; align-items: center; justify-content: space-between;
        gap: 12px;
      }
      .paired-row .info {
        font-size: 12px; color: var(--text-2);
        font-family: ui-monospace, "SF Mono", Menlo, monospace;
        word-break: break-all;
      }
      .paired-row .label-line {
        font-size: 10px; color: var(--text-3);
        letter-spacing: 0.16em; text-transform: uppercase;
        margin-bottom: 4px;
      }
      .hidden { display: none !important; }
    </style>
  </head>
  <body>
    <div class="ambient"></div>

    <main>
      <h1>SOLD<span class="dot"></span>TRACKER<span class="dot"></span>SETTINGS</h1>

      <!-- PAIRING (shown when not yet paired) -->
      <div class="panel" id="pair-panel">
        <label for="supabase-url">
          Dashboard URL
          <small>The Supabase project URL printed on your dashboard's <em>Settings → Pair extension</em> page. Looks like <code>https://abcde.supabase.co</code>.</small>
        </label>
        <input id="supabase-url" type="url" placeholder="https://YOUR-PROJECT.supabase.co" autocomplete="off" />

        <label for="pair-code" style="margin-top: 12px;">
          Pairing code
          <small>The 6-digit code shown on the dashboard. Codes expire after 10 minutes.</small>
        </label>
        <input id="pair-code" type="text" class="code-input" inputmode="numeric" maxlength="6" placeholder="000000" autocomplete="off" />

        <div class="actions">
          <span class="msg" id="pair-msg"></span>
          <button class="primary" id="pair-btn">Pair</button>
        </div>
      </div>

      <!-- PAIRED INFO (shown after pairing) -->
      <div class="panel hidden" id="paired-panel">
        <div class="paired-row">
          <div>
            <div class="label-line">Paired</div>
            <div class="info" id="paired-info">—</div>
          </div>
          <button class="danger" id="unpair-btn">Unpair</button>
        </div>
      </div>

      <!-- REFRESH INTERVAL -->
      <div class="panel">
        <label for="refresh">
          Refresh interval
          <small>How often to poll each shop, in minutes. Minimum 1.</small>
        </label>
        <input id="refresh" type="number" min="1" max="120" />
        <div class="actions">
          <span class="msg" id="saved-msg"></span>
          <button class="primary" id="save-refresh">Save</button>
        </div>
      </div>
    </main>

    <script type="module" src="options.js"></script>
  </body>
</html>
